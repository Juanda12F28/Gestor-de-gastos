<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos e Inventario Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <!-- Barra Superior -->
    <header class="bg-[#1b5e20] text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-400 p-1.5 rounded-lg text-slate-900 font-bold text-xs">🐷</div>
            <h1 class="text-lg font-bold">Gestor de Gastos & Inventario</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Tarjeta de Balance General -->
        <div class="bg-[#2e7d32] text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 text-emerald-800 text-8xl opacity-20 font-bold">💰</div>
            <p class="text-xs text-emerald-200 uppercase tracking-wider">Balance Total Actual</p>
            <h2 id="lblBalance" class="text-3xl font-extrabold mt-1">$0.00</h2>
            
            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-emerald-700 text-center text-xs">
                <div>
                    <p class="text-emerald-200">Ingresos / Ventas</p>
                    <p id="lblIngresos" class="font-bold text-sm text-white">$0.00</p>
                </div>
                <div>
                    <p class="text-rose-200">Gastos (Compras)</p>
                    <p id="lblGastos" class="font-bold text-sm text-white">$0.00</p>
                </div>
                <div>
                    <p class="text-amber-200">Utilidad / Margen</p>
                    <p id="lblGanancia" class="font-bold text-sm text-amber-300">$0.00</p>
                </div>
            </div>
        </div>

        <!-- Menú de Pestañas -->
        <div class="flex bg-white rounded-xl shadow-sm p-1 border border-slate-200">
            <button onclick="cambiarTab('finanzas')" id="tabFinanzas" class="flex-1 py-2 text-center font-bold rounded-lg bg-[#2e7d32] text-white transition text-sm">Finanzas</button>
            <button onclick="cambiarTab('inventario')" id="tabInventario" class="flex-1 py-2 text-center font-bold rounded-lg text-slate-600 transition text-sm">Inventario</button>
        </div>

        <!-- SECCIÓN 1: FINANZAS -->
        <div id="seccionFinanzas" class="space-y-4">
            <div class="flex gap-2">
                <button onclick="abrirModalMov('INGRESO')" class="flex-1 bg-[#2e7d32] hover:bg-emerald-800 text-white py-2.5 rounded-xl font-semibold shadow-sm text-sm">＋ Ingreso Extra</button>
                <button onclick="abrirModalMov('GASTO')" class="flex-1 bg-rose-700 hover:bg-rose-800 text-white py-2.5 rounded-xl font-semibold shadow-sm text-sm">－ Gasto / Compra</button>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-700 text-sm mb-3">Historial de Movimientos</h3>
                <div id="listaMovimientos" class="space-y-2.5 max-h-[400px] overflow-y-auto pr-1">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: INVENTARIO INTELIGENTE -->
        <div id="seccionInventario" class="space-y-4 hidden">
            <button onclick="abrirModalProducto()" class="w-full bg-[#2e7d32] hover:bg-emerald-800 text-white py-3 rounded-xl font-bold shadow-sm text-sm flex items-center justify-center gap-2">
                <span>📦</span> Registrar Nuevo Producto / Categoría
            </button>

            <div id="listaProductos" class="space-y-3">
                <!-- Dinámico -->
            </div>
        </div>

    </main>

    <!-- MODAL: MOVIMIENTO MANUAL -->
    <div id="modalMov" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-2xl">
            <h3 id="tituloModalMov" class="font-bold text-base text-slate-800">Registrar Movimiento</h3>
            <input type="text" id="descMov" placeholder="Concepto (ej. Proveedor Plátano, Servicios...)" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <input type="number" id="montoMov" placeholder="Monto total" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <div class="flex gap-2 pt-2">
                <button onclick="cerrarModal('modalMov')" class="flex-1 bg-slate-200 hover:bg-slate-300 py-2 rounded-xl font-semibold text-sm text-slate-700">Cancelar</button>
                <button onclick="guardarMovimientoManual()" class="flex-1 bg-[#2e7d32] hover:bg-emerald-800 py-2 rounded-xl font-semibold text-sm text-white">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CREAR PRODUCTO -->
    <div id="modalProd" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-2xl">
            <h3 class="font-bold text-base text-slate-800">Nuevo Producto (Ej. Plátano por Proveedor)</h3>
            <input type="text" id="nombreProd" placeholder="Nombre / Proveedor (ej. Plátano - Don Jairo)" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <input type="number" id="costoProd" placeholder="Precio de Costo unitario" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <input type="number" id="ventaProd" placeholder="Precio de Venta unitario al público" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <input type="number" id="stockProd" placeholder="Cantidad inicial en stock" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <div class="flex gap-2 pt-2">
                <button onclick="cerrarModal('modalProd')" class="flex-1 bg-slate-200 hover:bg-slate-300 py-2 rounded-xl font-semibold text-sm text-slate-700">Cancelar</button>
                <button onclick="guardarProducto()" class="flex-1 bg-[#2e7d32] hover:bg-emerald-800 py-2 rounded-xl font-semibold text-sm text-white">Crear</button>
            </div>
        </div>
    </div>

    <!-- MODAL: REABASTECER (COMPRAR MÁS) QUE REGISTRA GASTO AUTOMÁTICO Y SUMA STOCK -->
    <div id="modalReabastecer" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3 shadow-2xl">
            <h3 class="font-bold text-base text-slate-800">Comprar / Reabastecer Mercancía</h3>
            <p id="infoProdReabastecer" class="text-xs text-slate-500"></p>
            <input type="number" id="cantidadReabastecer" placeholder="Cantidad a comprar (unidades/kilos)" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <input type="text" id="proveedorReabastecer" placeholder="Proveedor (opcional)" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2e7d32]">
            <div class="flex gap-2 pt-2">
                <button onclick="cerrarModal('modalReabastecer')" class="flex-1 bg-slate-200 hover:bg-slate-300 py-2 rounded-xl font-semibold text-sm text-slate-700">Cancelar</button>
                <button onclick="confirmarReabastecimiento()" class="flex-1 bg-[#2e7d32] hover:bg-emerald-800 py-2 rounded-xl font-semibold text-sm text-white">Comprar y Sumar Stock</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        let estado = JSON.parse(localStorage.getItem('app_gestor_datos_v2')) || {
            productos: [
                { id: 1, nombre: "Plátano Hartón (Proveedor Jairo)", costo: 2000, venta: 3500, stock: 50 }
            ],
            movimientos: []
        };

        let tipoMovimientoActual = 'GASTO';
        let productoSeleccionadoId = null;

        function persistirYActualizar() {
            localStorage.setItem('app_gestor_datos_v2', JSON.stringify(estado));
            renderizarApp();
        }

        function formatoMoneda(valor) {
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(valor);
        }

        function cambiarTab(tab) {
            if (tab === 'finanzas') {
                document.getElementById('seccionFinanzas').classList.remove('hidden');
                document.getElementById('seccionInventario').classList.add('hidden');
                document.getElementById('tabFinanzas').className = "flex-1 py-2 text-center font-bold rounded-lg bg-[#2e7d32] text-white transition text-sm";
                document.getElementById('tabInventario').className = "flex-1 py-2 text-center font-bold rounded-lg text-slate-600 transition text-sm";
            } else {
                document.getElementById('seccionFinanzas').classList.add('hidden');
                document.getElementById('seccionInventario').classList.remove('hidden');
                document.getElementById('tabFinanzas').className = "flex-1 py-2 text-center font-bold rounded-lg text-slate-600 transition text-sm";
                document.getElementById('tabInventario').className = "flex-1 py-2 text-center font-bold rounded-lg bg-[#2e7d32] text-white transition text-sm";
            }
        }

        function renderizarApp() {
            let ingresosTotales = 0;
            let gastosTotales = 0;
            let utilidadNetaTotal = 0;

            let htmlMovs = '';
            estado.movimientos.forEach(m => {
                if (m.tipo === 'INGRESO' || m.tipo === 'VENTA') {
                    ingresosTotales += m.monto;
                    if (m.utilidad) utilidadNetaTotal += m.utilidad;
                } else {
                    gastosTotales += m.monto;
                }

                let esGasto = m.tipo === 'GASTO';
                htmlMovs += `
                    <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-semibold text-sm text-slate-800">${m.descripcion}</p>
                            <p class="text-[11px] text-slate-400">${m.tipo === 'VENTA' ? '✨ Venta: Suma margen/utilidad' : '🛒 Gasto / Compra de inventario'}</p>
                        </div>
                        <span class="font-bold text-sm ${esGasto ? 'text-rose-600' : 'text-emerald-700'}">
                            ${esGasto ? '-' : '+'} ${formatoMoneda(m.monto)}
                        </span>
                    </div>`;
            });

            document.getElementById('listaMovimientos').innerHTML = htmlMovs || '<p class="text-center text-slate-400 text-xs py-6">Sin movimientos registrados</p>';

            let balance = ingresosTotales - gastosTotales;
            document.getElementById('lblBalance').innerText = formatoMoneda(balance);
            document.getElementById('lblIngresos').innerText = formatoMoneda(ingresosTotales);
            document.getElementById('lblGastos').innerText = formatoMoneda(gastosTotales);
            document.getElementById('lblGanancia').innerText = formatoMoneda(utilidadNetaTotal);

            let htmlProds = '';
            estado.productos.forEach(p => {
                let stockBajo = p.stock <= 5;
                htmlProds += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <div class="space-y-0.5">
                            <h4 class="font-bold text-slate-800 text-sm">${p.nombre}</h4>
                            <p class="text-xs text-slate-500">Venta: ${formatoMoneda(p.venta)} | Costo: ${formatoMoneda(p.costo)}</p>
                            <p class="text-xs font-bold ${stockBajo ? 'text-rose-600' : 'text-emerald-700'}">
                                Stock disponible: ${p.stock} unids ${stockBajo ? '⚠️' : ''}
                            </p>
                        </div>
                        <div class="flex gap-1.5">
                            <button onclick="venderUnidad(${p.id})" class="bg-amber-400 hover:bg-amber-500 text-slate-900 px-3 py-2 rounded-xl font-bold text-xs shadow-sm transition">
                                Vender 1
                            </button>
                            <button onclick="abrirModalReabastecer(${p.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-2 rounded-xl font-bold text-xs border border-slate-300 transition" title="Comprar más stock">
                                Comprar
                            </button>
                        </div>
                    </div>`;
            });

            document.getElementById('listaProductos').innerHTML = htmlProds || '<p class="text-center text-slate-400 text-xs py-6">No hay productos en inventario</p>';
        }

        // --- LÓGICA DE NEGOCIO Y AUTOMATIZACIÓN ---
        
        // 1. VENTA: Resta stock y en ingresos suma SOLO la diferencia (el margen/utilidad: Venta - Costo)
        function venderUnidad(id) {
            let producto = estado.productos.find(p => p.id === id);
            if (producto && producto.stock > 0) {
                producto.stock--; // Se descuenta del inventario automáticamente
                
                let margenUtilidad = producto.venta - producto.costo; // Diferencia costo vs venta
                
                // Se registra en ingresos únicamente la diferencia de la venta
                estado.movimientos.unshift({
                    tipo: 'VENTA',
                    monto: margenUtilidad, 
                    utilidad: margenUtilidad,
                    descripcion: `Venta: 1x ${producto.nombre} (Margen)`
                });

                persistirYActualizar();
            } else {
                alert("¡Stock agotado de este producto!");
            }
        }

        // 2. COMPRA / REABASTECIMIENTO: Registra Gasto y suma inventario automáticamente
        function abrirModalReabastecer(id) {
            productoSeleccionadoId = id;
            let p = estado.productos.find(x => x.id === id);
            document.getElementById('infoProdReabastecer').innerText = `Producto: ${p.nombre} (Costo unitario: ${formatoMoneda(p.costo)})`;
            document.getElementById('cantidadReabastecer').value = '';
            document.getElementById('proveedorReabastecer').value = '';
            document.getElementById('modalReabastecer').classList.remove('hidden');
        }

        function confirmarReabastecimiento() {
            let cantidad = parseInt(document.getElementById('cantidadReabastecer').value);
            let proveedor = document.getElementById('proveedorReabastecer').value || 'Proveedor general';
            let producto = estado.productos.find(p => p.id === productoSeleccionadoId);

            if (producto && cantidad > 0) {
                let costoTotalCompra = producto.costo * cantidad;

                // Suma automáticamente al inventario
                producto.stock += cantidad;

                // Registra automáticamente el costo total como GASTO
                estado.movimientos.unshift({
                    tipo: 'GASTO',
                    monto: costoTotalCompra,
                    descripcion: `Compra inventario: ${cantidad}x ${producto.nombre} (${proveedor})`
                });

                cerrarModal('modalReabastecer');
                persistirYActualizar();
            } else {
                alert("Ingresa una cantidad válida.");
            }
        }

        // --- MODALES GENERALES ---
        function abrirModalMov(tipo) {
            tipoMovimientoActual = tipo;
            document.getElementById('tituloModalMov').innerText = tipo === 'INGRESO' ? 'Registrar Ingreso Extra' : 'Registrar Gasto o Compra General';
            document.getElementById('modalMov').classList.remove('hidden');
        }

        function abrirModalProducto() {
            document.getElementById('modalProd').classList.remove('hidden');
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function guardarMovimientoManual() {
            let desc = document.getElementById('descMov').value;
            let monto = parseFloat(document.getElementById('montoMov').value);
            if (desc && monto > 0) {
                estado.movimientos.unshift({
                    tipo: tipoMovimientoActual,
                    monto: monto,
                    utilidad: 0,
                    descripcion: desc
                });
                document.getElementById('descMov').value = '';
                document.getElementById('montoMov').value = '';
                cerrarModal('modalMov');
                persistirYActualizar();
            } else {
                alert("Completa todos los campos correctamente.");
            }
        }

        function guardarProducto() {
            let nombre = document.getElementById('nombreProd').value;
            let costo = parseFloat(document.getElementById('costoProd').value) || 0;
            let venta = parseFloat(document.getElementById('ventaProd').value) || 0;
            let stock = parseInt(document.getElementById('stockProd').value) || 0;

            if (nombre && venta > 0 && stock >= 0) {
                estado.productos.push({
                    id: Date.now(),
                    nombre, costo, venta, stock
                });
                document.getElementById('nombreProd').value = '';
                document.getElementById('costoProd').value = '';
                document.getElementById('ventaProd').value = '';
                document.getElementById('stockProd').value = '';
                cerrarModal('modalProd');
                persistirYActualizar();
            } else {
                alert("Revisa los datos ingresados.");
            }
        }

        renderizarApp();
    </script>
</body>
</html>
